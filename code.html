<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>script.js — مختبر الرياضيات</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Cairo:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(160deg, #060d1f, #0b1a3f);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      font-family: "Cairo", sans-serif;
    }
    .window {
      width: 100%;
      max-width: 860px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(96, 165, 250, 0.25);
    }
    .titlebar {
      background: #20242c;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.r { background: #ff5f57; }
    .dot.y { background: #febc2e; }
    .dot.g { background: #28c840; }
    .titlebar span { color: #8b95a5; font-size: 0.85rem; margin-left: 10px; font-family: "JetBrains Mono", monospace; }
    .code {
      background: #11141a;
      padding: 18px 0;
      max-height: 70vh;
      overflow: auto;
    }
    pre {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.82rem;
      line-height: 1.65;
      color: #d6deeb;
      counter-reset: line;
    }
    .ln { display: block; padding: 0 18px; }
    .ln::before {
      counter-increment: line;
      content: counter(line);
      display: inline-block;
      width: 2.6em;
      margin-right: 1.4em;
      text-align: right;
      color: #3d4557;
      user-select: none;
    }
    .ln:hover { background: rgba(96, 165, 250, 0.06); }
    .k { color: #82aaff; }   /* keywords */
    .s { color: #c3e88d; }   /* strings */
    .c { color: #5b6378; font-style: italic; } /* comments */
    .n { color: #f78c6c; }   /* numbers */
    .f { color: #ffcb6b; }   /* function names */
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <span>math-lab / script.js</span>
    </div>
    <div class="code"><pre id="pre"></pre></div>
  </div>
  <script>
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const highlight = (line) => {
      const store = [];
      const keep = (html) => { store.push(html); return "\x00" + (store.length - 1) + "\x01"; };
      let out = esc(line);
      out = out.replace(/&quot;.*?&quot;|".*?"|&#39;.*?&#39;|`.*?`/g, (m) => keep('<span class="s">' + m + '</span>'));
      out = out.replace(/(\/\/.*$)/, (m) => keep('<span class="c">' + m + '</span>'));
      out = out.replace(/(\/\*.*?\*\/)/g, (m) => keep('<span class="c">' + m + '</span>'));
      out = out.replace(/\b(const|let|var|function|return|if|else|for|while|of|in|new|typeof|document|window)\b/g, '<span class="k">$1</span>');
      out = out.replace(/(?<![\w\x00])(\d+\.?\d*)(?![\w\x00])/g, '<span class="n">$1</span>');
      out = out.replace(/([a-zA-Z_$][\w$]*)(?=\()/g, '<span class="f">$1</span>');
      out = out.replace(/\x00(\d+)\x01/g, (m, i) => store[+i]);
      return out;
    };
    fetch("script.js")
      .then((r) => r.text())
      .then((src) => {
        document.getElementById("pre").innerHTML = src
          .split("\n")
          .map((l) => `<span class="ln">${highlight(l) || " "}</span>`)
          .join("");
      });
  </script>
</body>
</html>
