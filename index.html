<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>blue calculator 💙</title>
  <meta name="description" content="a cute little blue calculator made with HTML, CSS, and JavaScript — by Global Math." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💙</text></svg>" />
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <!-- soft blurred blobs -->
  <div class="blobs" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="bg-symbols" aria-hidden="true">
    <span style="--x:8%;  --d:0s;   --s:1.8rem">π</span>
    <span style="--x:20%; --d:4s;   --s:1.3rem">∑</span>
    <span style="--x:33%; --d:7s;   --s:1.6rem">√</span>
    <span style="--x:52%; --d:2s;   --s:1.2rem">∞</span>
    <span style="--x:66%; --d:5.5s; --s:1.7rem">✳</span>
    <span style="--x:80%; --d:1s;   --s:1.3rem">÷</span>
    <span style="--x:91%; --d:6s;   --s:1.6rem">+</span>
  </div>

  <main class="page">
    <section class="calc">
      <header class="calc-head">
        <div class="calc-title">💙 blue calculator</div>
        <div class="calc-sub">made for you</div>
      </header>

      <div class="display">
        <div class="display-history" id="calc-history">&nbsp;</div>
        <div class="display-current" id="calc-current">0</div>
      </div>

      <div class="keys">
        <button class="key fn" data-action="clear">AC</button>
        <button class="key fn" data-action="backspace">⌫</button>
        <button class="key fn" data-action="negate">+/−</button>
        <button class="key op" data-op="/">÷</button>

        <button class="key" data-digit="7">7</button>
        <button class="key" data-digit="8">8</button>
        <button class="key" data-digit="9">9</button>
        <button class="key op" data-op="*">×</button>

        <button class="key" data-digit="4">4</button>
        <button class="key" data-digit="5">5</button>
        <button class="key" data-digit="6">6</button>
        <button class="key op" data-op="-">−</button>

        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2</button>
        <button class="key" data-digit="3">3</button>
        <button class="key op" data-op="+">+</button>

        <button class="key zero" data-digit="0">0</button>
        <button class="key" data-action="dot">.</button>
        <button class="key equals" data-action="equals">=</button>
      </div>

      <div class="keys keys-sci">
        <button class="key fn small" data-action="sqrt">√</button>
        <button class="key fn small" data-action="square">x²</button>
        <button class="key fn small" data-action="inverse">1/x</button>
        <button class="key fn small" data-action="pi">π</button>
      </div>

      <footer class="calc-foot">a little math in blue ✨</footer>
    </section>
  </main>

  <script src="script.js?v=5"></script>
</body>
</html>
